<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<style>
    body{
        background-color: black;
    }
   .box{
    border: 2px solid white;
   }
   .log{
    border: 2px solid white;
   }
   .sign{
    border: 2px solid white;
   }
</style>
</head>
<body>
    
    <div class="container">
        <div class="box">
            <div class="log text-center">
                <div class="row mt-3"><div class="col-md-12"><h2>Login Form</h2></div></div>
                <div class="row mt-4">
                <div class="col-md-12"><input type="text" placeholder="Enter your valid email ..."></div>
                </div>
                <div class="row mt-4">
                <div class="col-md-12"><input type="password" placeholder="Enter your Password ..."></div>
                </div>
                <div class="row mt-4 mb-2">
                    <div class="col-md-12"><button><h5>Login now</h5></button></div>
                </div>
            </div>

            <div class="sign text-center">
                <div class="row mt-3"><h2>Sign in form</h2></div>
                <div class="row mt-2">
                    <div class="col-md-6"><label for="email">Email:</label><input type="text" placeholder="Enter your valid email here..."></div>
                    <div class="col-md-6"><label for="password">Password:</label><input type="password" placeholder="Enter your password here..."></div>
                </div>
                <div class="row mt-4 mb-2">
                    <div class="col-md-12"><button><h5>Login now</h5></button></div>
                </div>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
