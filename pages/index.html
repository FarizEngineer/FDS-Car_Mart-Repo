<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<style>
    body{
        background-color: black;
    }
   .log{
    border: 2px solid white;
   }
   .sign{
    border: 2px solid white;
    border-radius: 15px;
   }
   /* inputs */
   #regname{
    border-radius: 6px;
   }
   #regmail{
    border-radius: 6px;
   }
   #regpass{
    border-radius: 6px;
   }
   #regconfirm{
    border-radius: 6px;
   }
</style>
</head>
<body>
    
 
    <!-- Sign in form -->
<form>
      <div class="container mb-2 text-center">
    <h1 class="mt-3 mb-1" style="font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Create a new account</h1>
    <div class="sign text-center mt-3">
                <div class="row mt-3"><h2 style="color: gray; font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif">Registration form</h2></div>
                <div class="row mt-3">
                    <div class="col-md-6"><label for="name"  style="color: gray; font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif">Name : |</label><input type="text" id="regname" placeholder="Enter your full name..." required><p style="color: red;" id="namevalid"></p></div>
                    <div class="col-md-6"><label for="email" style="color: gray; font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif">Email : |</label><input type="text" id="regmail" placeholder="Enter your valid email..." required><p style="color: red;" id="emailvalid"></p></div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-6"><label for="Password"  style="color: gray; font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif">Password : |</label><input type="password" id="regpass" placeholder="Enter your password..."  required><p style="color: red;" id="passvalid"></p></div>
                    <div class="col-md-6"><label for="password" style="color: gray; font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif">Confirm Password : |</label><input type="password" id="regconfirm" placeholder="Confirm your password..."  required><p style="color: red;" id="conpassvalid"></p></div>
                </div>
                <div class="row mt-4 mb-3">
                    <div class="col-md-12"> 
                       <button type="button" class="btn btn-outline-secondary" onclick="reg()" style="font-size: large; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Register Now</button>
                    </div>
                </div>
                </div>
                 <br>
                    <button class="btn btn-outline-light" onclick="visitsite()" style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;"><h5 class="mt-1 mb-1">- Just visit site -</h5></button>
</div>
</form>


   <script src="../assets/Logic.js"></script>
</body>
</html>
