  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container text-center">
        <form>

        <div class="row text-center mt-4"><div class="col-md-6 offset-3"><h1>Login Page</h1></div></div>
        <div class="row text-center">
            <div class="col-md-6 offset-3 mt-4"><input class="form-control" id="logname" type="text" placeholder="Write your name here..." oninput="loginname()"><p id="namevalid" style="color: red;"></p></div>
        </div>
        <div class="row text-center">
            <div class="col-md-6 offset-3 mt-4"><input class="form-control" id="logmail" type="text" placeholder="Write your mail here..."  oninput="loginmail()"><p id="mailvalid" style="color: red;"></p></div>
        </div>
        <div class="row text-center">
            <div class="col-md-6 offset-3 mt-4"><input class="form-control" id="logpass" type="password" placeholder="Write your password here..." oninput="loginpass()"><p id="passvalid" style="color: red;"></p></div>
        </div>

        </form>
        <button class="btn btn-outline-success mt-4" onclick="login()">Login now</button>
    </div>
  
  
  <script src="../assets/Logic.js"></script>
</body>
</html>
